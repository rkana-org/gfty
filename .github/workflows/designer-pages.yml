name: Deploy Gridfinity Ultimate designer

on:
  push:
    tags:
      - "designer-v*"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31

      # designer-v42 must match the immutable model version linked by the app.
      - name: Check tag matches pinned Onshape model version
        run: |
          ver="$(sed -n 's/^const ONSHAPE_VERSION = "\(.*\)";.*/\1/p' designer/JsonPanel.jsx)"
          tag="${GITHUB_REF_NAME#designer-}"
          if [[ "${tag,,}" != "${ver,,}" ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match ONSHAPE_VERSION '$ver'"
            exit 1
          fi

      - name: Build static site
        run: nix build --print-build-logs .#designer

      # Pages tooling cannot handle read-only Nix store permissions.
      - name: Stage artifact
        run: |
          cp -rL result public
          chmod -R +w public

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
