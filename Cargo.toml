[package]
name = "gfty-label"
version = "0.1.0"
edition = "2024"
description = "File-based Gridfinity label composer and Onshape exporter"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
roxmltree = "0.21"
toml = "0.9"
usvg = "0.47"
xmltree = { version = "0.12", features = ["attribute-sorted"] }

[dev-dependencies]
tempfile = "3.20"
