[package]
name = "gfty-label"
version = "0.1.0"
edition = "2024"
description = "File-based Gridfinity label composer and Onshape exporter"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
colored = "3.1"
notify = "8.2"
image = { version = "0.25", default-features = false }
rasteroid = "=0.3.2"
resvg = "0.47"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
roxmltree = "0.21"
toml = "0.9"
usvg = "0.47"
xmltree = { version = "0.12", features = ["attribute-sorted"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.20"
